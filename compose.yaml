services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: madurai
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: madurai
    ports: ['5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U madurai']
      interval: 5s
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: local-minio-development-only
    ports: ['9000:9000', '9001:9001']
    volumes: ['images:/data']
volumes:
  postgres:
  images:
